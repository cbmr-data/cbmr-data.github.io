image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  LATEST_TAG: $CI_REGISTRY_IMAGE:latest

stages:
  - build

build:
  stage: build
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - apk add --no-cache make python3 py3-pip uv
  script:
    - make build
    - docker build --platform=linux/amd64 --build-arg GIT_COMMIT=$CI_COMMIT_SHORT_SHA -t $IMAGE_TAG -t $LATEST_TAG .
    - docker push --all-tags $CI_REGISTRY_IMAGE
  only:
    - localdeploy
